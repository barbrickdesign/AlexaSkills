name: Deploy generated Alexa skills

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy a single skill or every generated skill
        required: true
        type: choice
        default: single
        options:
          - single
          - all
      skill_name:
        description: Exact GeneratedSkills directory name to deploy when deploy_target is single
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
      ASK_LWA_CLIENT_ID: ${{ secrets.ASK_CLIENT_ID }}
      ASK_LWA_CLIENT_CONFIRMATION: ${{ secrets.ASK_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      SHARED_LAMBDA_ARN: ${{ secrets.SHARED_LAMBDA_ARN }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install ASK CLI
        run: npm install --global ask-cli

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          required_vars=(
            ASK_LWA_CLIENT_ID
            ASK_LWA_CLIENT_CONFIRMATION
            ASK_REFRESH_TOKEN
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              missing+=("$var_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Initialize ASK CLI profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ask
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "profiles": {
                  "default": {
                      "token": {
                          "access_token": None,
                          "refresh_token": os.environ["ASK_REFRESH_TOKEN"],
                          "token_type": "bearer",
                          "expires_in": 3600,
                          "expires_at": "2019-01-01T00:00:00.000Z",
                      },
                      "vendor_id": os.environ.get("ASK_VENDOR_ID", ""),
                      "aws_profile": "default",
                  }
              }
          }

          config_path = Path.home() / ".ask" / "cli_config"
          config_path.write_text(json.dumps(config, indent=2), encoding="utf-8")
          PY
          chmod 600 ~/.ask/cli_config

      - name: Configure AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set region "us-east-1"
          if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            aws configure set aws_session_token "$AWS_SESSION_TOKEN"
          fi

      - name: Fix shared Lambda permissions
        if: env.SHARED_LAMBDA_ARN != ''
        shell: bash
        run: |
          set -euo pipefail
          function_name="${SHARED_LAMBDA_ARN##*:}"
          aws lambda add-permission \
            --function-name "$function_name" \
            --statement-id allow-alexa-all-skills \
            --action lambda:InvokeFunction \
            --principal alexa-appkit.amazon.com \
            --region us-east-1 \
            --output text >/dev/null 2>&1 || true

      - name: Deploy selected skills
        shell: bash
        run: |
          set -euo pipefail

          skills_root="$GITHUB_WORKSPACE/GeneratedSkills"
          deploy_target="${{ github.event.inputs.deploy_target }}"
          requested_skill="${{ github.event.inputs.skill_name }}"

          if [ ! -d "$skills_root" ]; then
            echo "GeneratedSkills directory not found at $skills_root" >&2
            exit 1
          fi

          declare -a discovered_skill_dirs=()
          while IFS= read -r -d '' ask_file; do
            discovered_skill_dirs+=("$(dirname "$ask_file")")
          done < <(find "$skills_root" -mindepth 2 -maxdepth 2 -name ask-resources.json -print0 | sort -z)

          if [ "${#discovered_skill_dirs[@]}" -eq 0 ]; then
            echo "No deployable skills were found under $skills_root" >&2
            exit 1
          fi

          declare -a selected_skill_dirs=()
          if [ "$deploy_target" = "single" ]; then
            if [ -z "$requested_skill" ]; then
              echo "skill_name is required when deploy_target is single" >&2
              exit 1
            fi

            for skill_dir in "${discovered_skill_dirs[@]}"; do
              if [ "$(basename "$skill_dir")" = "$requested_skill" ]; then
                selected_skill_dirs+=("$skill_dir")
                break
              fi
            done

            if [ "${#selected_skill_dirs[@]}" -eq 0 ]; then
              echo "Unable to find a deployable skill named '$requested_skill'" >&2
              echo "Available skills:" >&2
              printf ' - %s\n' "${discovered_skill_dirs[@]##*/}" >&2
              exit 1
            fi
          else
            selected_skill_dirs=("${discovered_skill_dirs[@]}")
          fi

          declare -a failed_skills=()
          declare -a deployed_skills=()

          for skill_dir in "${selected_skill_dirs[@]}"; do
            skill_name="$(basename "$skill_dir")"

            echo "::group::Preparing $skill_name"
            if [ ! -f "$skill_dir/skill-package/skill.json" ]; then
              echo "Missing skill-package/skill.json for $skill_name" >&2
              failed_skills+=("$skill_name")
              echo "::endgroup::"
              continue
            fi

            normalize_status="$(
              python - "$skill_dir" "${SHARED_LAMBDA_ARN:-}" <<'PY'
              import json
              import re
              import sys
              from pathlib import Path

              skill_dir = Path(sys.argv[1])
              shared_lambda_arn = sys.argv[2].strip()
              manifest_path = skill_dir / "skill-package" / "skill.json"
              ask_states_path = skill_dir / ".ask" / "ask-states.json"
              model_candidates = [
                  skill_dir / "models" / "en-US.json",
                  skill_dir / "skill-package" / "interactionModels" / "custom" / "en-US.json",
              ]

              allowed_categories = {
                  "KNOWLEDGE_AND_TRIVIA",
                  "GAMES",
                  "EDUCATION_AND_REFERENCE",
                  "LIFESTYLE",
                  "MUSIC_AND_AUDIO",
                  "NOVELTY",
                  "HUMOR",
                  "MOVIES_AND_TV",
                  "SOCIAL",
                  "UTILITIES",
                  "HEALTH_AND_FITNESS",
                  "FOOD_AND_DRINK",
                  "SMART_HOME",
                  "KIDS",
                  "BUSINESS_AND_FINANCE",
                  "COMMUNICATION",
                  "SHOPPING",
                  "SPORTS",
                  "WEATHER",
              }
              category_map = {
                  "NOVELTY_AND_HUMOR": "NOVELTY",
                  "PRODUCTIVITY": "UTILITIES",
                  "GAMES_TRIVIA_AND_ACCESSORIES": "GAMES",
                  "ENTERTAINMENT": "NOVELTY",
                  "NEWS": "EDUCATION_AND_REFERENCE",
              }
              default_category = "KNOWLEDGE_AND_TRIVIA"

              def read_json(path: Path):
                  return json.loads(path.read_text(encoding="utf-8-sig"))

              def write_json(path: Path, payload):
                  path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

              def to_invocation_name(name: str) -> str:
                  if not name:
                      return "my skill"
                  n = name.lower()
                  for digit, word in (("0", " zero "), ("1", " one "), ("2", " two "), ("3", " three "), ("4", " four "), ("5", " five "), ("6", " six "), ("7", " seven "), ("8", " eight "), ("9", " nine ")):
                      n = n.replace(digit, word)
                  n = re.sub(r"[^a-z '.]", " ", n)
                  n = re.sub(r"\s+", " ", n).strip()
                  if not n:
                      n = "my skill"
                  if not re.match(r"^[a-z]", n):
                      n = "the " + n
                  return n

              if not manifest_path.exists():
                  print("error:missing-manifest")
                  raise SystemExit(0)

              try:
                  manifest = read_json(manifest_path)
              except Exception as exc:
                  print(f"error:invalid-manifest:{exc}")
                  raise SystemExit(0)

              manifest_root = manifest.get("manifest")
              if not isinstance(manifest_root, dict):
                  print("error:missing-manifest-root")
                  raise SystemExit(0)

              publishing = manifest_root.setdefault("publishingInformation", {})
              apis = manifest_root.setdefault("apis", {})
              custom = apis.setdefault("custom", {})
              endpoint = custom.get("endpoint")
              if endpoint is None:
                  endpoint = {}
                  custom["endpoint"] = endpoint
              if not isinstance(endpoint, dict):
                  print("error:invalid-manifest-custom-endpoint")
                  raise SystemExit(0)

              has_uri = isinstance(endpoint.get("uri"), str) and bool(endpoint["uri"].strip())
              has_source_dir = "sourceDir" in endpoint

              if shared_lambda_arn:
                  custom["endpoint"] = {"uri": shared_lambda_arn}
              elif has_source_dir and not has_uri:
                  print("needs-shared-arn")
                  raise SystemExit(0)
              elif has_uri:
                  endpoint.pop("sourceDir", None)
                  custom["endpoint"] = endpoint
              else:
                  print("error:missing-endpoint-uri")
                  raise SystemExit(0)

              category = publishing.get("category")
              publishing["category"] = category if category in allowed_categories else category_map.get(category, default_category)

              locales = publishing.get("locales")
              manifest_name = skill_dir.name
              if isinstance(locales, dict):
                  us_locale = locales.get("en-US")
                  if isinstance(us_locale, dict) and us_locale.get("name"):
                      manifest_name = str(us_locale["name"])

              model_path = next((candidate for candidate in model_candidates if candidate.exists()), None)
              if model_path is None:
                  print("error:missing-model")
                  raise SystemExit(0)

              try:
                  model = read_json(model_path)
              except Exception as exc:
                  print(f"error:invalid-model:{exc}")
                  raise SystemExit(0)

              interaction_model = model.get("interactionModel")
              if not isinstance(interaction_model, dict):
                  print("error:missing-interaction-model")
                  raise SystemExit(0)
              language_model = interaction_model.get("languageModel")
              if not isinstance(language_model, dict):
                  print("error:missing-language-model")
                  raise SystemExit(0)

              language_model["invocationName"] = to_invocation_name(manifest_name)

              write_json(manifest_path, manifest)
              write_json(model_path, model)

              skill_id = None
              if ask_states_path.exists():
                  try:
                      ask_states = read_json(ask_states_path)
                      skill_id = ask_states.get("profiles", {}).get("default", {}).get("skillId")
                  except Exception:
                      skill_id = None

              print("ok:existing" if skill_id else "ok:new")
              PY
            )"

            case "$normalize_status" in
              ok:existing)
                deploy_mode="update"
                ;;
              ok:new)
                deploy_mode="create"
                ;;
              needs-shared-arn)
                echo "Manifest for $skill_name needs SHARED_LAMBDA_ARN to replace endpoint.sourceDir." >&2
                failed_skills+=("$skill_name")
                echo "::endgroup::"
                continue
                ;;
              *)
                echo "Invalid skill package for $skill_name: $normalize_status" >&2
                failed_skills+=("$skill_name")
                echo "::endgroup::"
                continue
                ;;
            esac

            if [ ! -f "$skill_dir/lambda/package.json" ]; then
              echo "Missing lambda/package.json for $skill_name" >&2
              failed_skills+=("$skill_name")
              echo "::endgroup::"
              continue
            fi

            if ! (
              cd "$skill_dir/lambda"
              npm install --omit=dev --no-audit --no-fund
            ); then
              echo "Dependency installation failed for $skill_name" >&2
              failed_skills+=("$skill_name")
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"

            echo "::group::Deploying $skill_name"
            if [ "$deploy_mode" = "update" ]; then
              if (
                cd "$skill_dir"
                ask deploy --profile default --ignore-hash
              ); then
                deployed_skills+=("$skill_name")
              else
                failed_skills+=("$skill_name")
              fi
            else
              if (
                cd "$skill_dir"
                ask deploy --profile default
              ); then
                deployed_skills+=("$skill_name")
              else
                failed_skills+=("$skill_name")
              fi
            fi
            echo "::endgroup::"
          done

          {
            echo "## Alexa skill deployment"
            echo
            echo "- Requested target: $deploy_target"
            if [ "$deploy_target" = "single" ]; then
              echo "- Requested skill: $requested_skill"
            fi
            echo "- Attempted: ${#selected_skill_dirs[@]}"
            echo "- Succeeded: ${#deployed_skills[@]}"
            echo "- Failed: ${#failed_skills[@]}"
            echo

            if [ "${#deployed_skills[@]}" -gt 0 ]; then
              echo "### Successful deployments"
              printf -- '- %s\n' "${deployed_skills[@]}"
              echo
            fi

            if [ "${#failed_skills[@]}" -gt 0 ]; then
              echo "### Failed deployments"
              printf -- '- %s\n' "${failed_skills[@]}"
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#failed_skills[@]}" -gt 0 ]; then
            echo "One or more skill deployments failed." >&2
            printf 'Failed skills: %s\n' "${failed_skills[*]}" >&2
            exit 1
          fi
